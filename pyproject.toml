[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicate-file-finder"
version = "0.1.0"
description = "A dependency-free Python CLI for finding duplicate files by content."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MugdhoAI"}
]

[project.scripts]
dupes = "duplicate_file_finder.cli:main"
duplicate-file-finder = "duplicate_file_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
